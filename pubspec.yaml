name: simple_kiosk_software
description: "简易医疗亭/simple kiosk software"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^8.2.6
  google_fonts: ^6.2.1
  image: ^4.1.4
  intl: any
  logger: ^2.3.0
  responsive_framework: ^0.2.0
  shared_preferences: ^2.2.3
  video_player: ^2.9.1
  buttons_tabbar: ^1.3.12
#  flutter_devices_sdk: # 包名
#    git:
#      url: https://github.com/Medlyves-Pte-Ltd/flutter_devices_sdk.git
#      url: https://gitee.com/caipingan456/flutter_devices_sdk.git
#      ref: caipingan # 分支

  flutter_devices_sdk:
    path: D:\Android\Projects\flutter\flutter_devices_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/videos/en/
    - assets/videos/zh/
    - assets/videos/ta/
    - assets/videos/ms/
    # device configs
    - assets/configs/devices/
